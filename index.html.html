<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Do You Love Me? 💗</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#ffd9e8,#fff3f8 50%,#ffc9df);
  color:#8d315b;
}
.card{
  width:min(88vw,410px);min-height:360px;padding:42px 24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;border-radius:30px;background:rgba(255,255,255,.82);
  box-shadow:0 20px 60px rgba(150,55,95,.18);position:relative;z-index:5;
}
.emoji{font-size:55px;margin-bottom:8px}
h1{font-size:30px;margin:0 0 9px}
p{font-size:16px;margin:0 0 25px;color:#a65377}
.area{position:relative;width:100%;height:100px}
button{
  position:absolute;top:18px;border:0;border-radius:999px;
  padding:14px 25px;font-size:17px;font-weight:750;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#yes{left:18%;background:#ff6fa8;color:white;box-shadow:0 8px 18px #ff6fa844}
#no{left:55%;background:white;color:#a94a73;border:2px solid #ffc1d8;
  transition:left .12s ease,top .12s ease,transform .12s ease}
.hint{font-size:13px;color:#c27798;margin-top:10px}
#answer{display:none}
#answer h2{font-size:30px;margin:8px 0 10px}
.big{font-size:68px}
.float{position:fixed;bottom:-40px;pointer-events:none;animation:up 7s linear forwards;z-index:1}
@keyframes up{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-110vh) rotate(360deg);opacity:0}}
.pop{animation:pop .55s ease}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.burst{position:fixed;z-index:20;pointer-events:none;font-size:25px}
</style>
</head>
<body>
<section class="card" id="question">
  <div class="emoji">🥺💗</div>
  <h1>DO YOU LOVE ME?</h1>
  <p>Be honest... hehe 👀💕</p>
  <div class="area" id="area">
    <button id="yes" type="button">YES 💕</button>
    <button id="no" type="button">NO 😈</button>
  </div>
  <div class="hint" id="hint">Choose wisely hehe</div>
</section>

<section class="card" id="answer">
  <div class="big">🥹💗</div>
  <h2>WELL, I LOVE YOU TOO!</h2>
  <p>Hehehe, I knew it. 💕</p>
  <div class="hint">You're stuck with me now. ♡</div>
</section>

<script>
(function(){
  const question=document.getElementById('question');
  const answer=document.getElementById('answer');
  const yes=document.getElementById('yes');
  const no=document.getElementById('no');
  const area=document.getElementById('area');
  const hint=document.getElementById('hint');

  const msgs=["Wrong answer 😭","Try again 😌","You sure? 👀","Nice try 😂",
              "NO is not an option 💅","Be serious 😭💕","Awww, don't lie 🥺","Hmm... suspicious 🤨💗"];
  let tries=0;

  function moveNo(e){
    if(e) e.preventDefault();
    tries++;
    const a=area.getBoundingClientRect();
    const b=no.getBoundingClientRect();
    const pad=4;
    const maxX=Math.max(pad,a.width-b.width-pad);
    const maxY=Math.max(8,a.height-b.height-pad);
    no.style.left=(pad+Math.random()*maxX)+'px';
    no.style.top=(8+Math.random()*maxY)+'px';
    no.textContent=tries>=7 ? "NO? 🥺" : msgs[(tries-1)%msgs.length];
    const scale=Math.max(.42,1-(tries*.08));
    no.style.transform='scale('+scale+')';
    hint.textContent=tries>=7 ? "Okay... just press YES already 😭💕" : "Hehehe, try again 👀";
  }

  // pointerdown works for both touch screens and mouse.
  no.addEventListener('pointerdown',moveNo);
  no.addEventListener('mouseenter',moveNo);

  yes.addEventListener('click',function(){
    question.style.display='none';
    answer.style.display='flex';
    answer.classList.add('pop');
    burst();
  });

  function burst(){
    const icons=["💗","💕","💖","💘","🌸"];
    for(let i=0;i<24;i++){
      const x=document.createElement('div');
      x.className='burst';
      x.textContent=icons[Math.floor(Math.random()*icons.length)];
      x.style.left='50%';x.style.top='50%';
      document.body.appendChild(x);
      const dx=(Math.random()-.5)*520,dy=(Math.random()-.5)*520;
      x.animate([
        {transform:'translate(-50%,-50%) scale(.5)',opacity:1},
        {transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) scale(1.3)',opacity:0}
      ],{duration:1000,easing:'ease-out'}).onfinish=function(){x.remove()};
    }
  }

  function floating(){
    const x=document.createElement('div');
    x.className='float';
    x.textContent=["♡","♥","💕","💗"][Math.floor(Math.random()*4)];
    x.style.left=(Math.random()*100)+'vw';
    x.style.fontSize=(18+Math.random()*18)+'px';
    x.style.animationDuration=(5+Math.random()*5)+'s';
    document.body.appendChild(x);
    setTimeout(()=>x.remove(),11000);
  }
  for(let i=0;i<10;i++) setTimeout(floating,i*400);
  setInterval(floating,700);
})();
</script>
</body>
</html>
